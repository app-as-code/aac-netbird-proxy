services:
  # --- Main Application Service ---
  aac-netbird-proxy:
    image: "netbirdio/reverse-proxy:0.74.2"
    container_name: "aac-netbird-proxy"
    hostname: "netbird-proxy"
    restart: "unless-stopped"


    environment:
      NB_PROXY_CERTIFICATE_DIRECTORY: "/certs"
      NB_PROXY_ALLOW_INSECURE: "true"
      NB_PROXY_MANAGEMENT_ADDRESS: "https://netbird.example.com"
      NB_PROXY_ACME_CERTIFICATES: "true"
      NB_PROXY_DOMAIN: "example.com"
      NB_PROXY_LOG_LEVEL: "info"
      NB_PROXY_TOKEN: "${NB_PROXY_TOKEN:?set NB_PROXY_TOKEN in .env (see .env.example)}"
      NB_PROXY_PRIVATE: "true"
      NB_PROXY_ADDRESS: ":443"

    ports:
      - "80:80/tcp"
      - "443:443/tcp"

    volumes:
      - "/export/docker/aac-netbird-proxy/proxy_certs:/certs"

    networks:
      - exposed
      - interconnect
      - stack_internal





networks:
  secured:
    name: "services-secured"
    external: true
  exposed:
    name: "services-exposed"
    external: true
  interconnect:
    name: "docker-default"
    external: true
  stack_internal:
    name: "aac-netbird-proxy_stack_internal"
    driver: "bridge"

